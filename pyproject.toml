[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chuh0o"
version = "0.1.0"
description = "A quiet pink bunny for your Windows desktop"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7", "pywin32>=308; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pyinstaller>=6.11,<7"]

[project.gui-scripts]
chuh0o = "chuh0o.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/chuh0o" = ["config.json"]
"share/chuh0o/assets" = ["assets/*.png", "assets/*.svg", "assets/manifest.json", "assets/bunny.ico"]
"share/chuh0o/resources" = ["resources/apply_update.ps1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
